[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "koltsey-tokenweight"
version = "0.1.0"
description = "按段落估算令牌数并标出高占比部分，区分长度与语义重要性"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "koltsey" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://koltsey.github.io"
Repository = "https://github.com/koltsey/tokenweight"
Issues = "https://github.com/koltsey/tokenweight/issues"

[project.scripts]
tokenweight = "tokenweight:main"

[tool.setuptools]
py-modules = ["tokenweight"]
